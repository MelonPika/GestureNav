<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hand Gesture Controller</title>
  <style>
    body {
      width: 180px;
      margin: 0;
      padding: 10px;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: white;
      font-family: sans-serif;
    }
    h3 { margin: 0; font-size: 12px; font-weight: 600; }
    #toggle {
      width: 100%;
      padding: 7px 0;
      border: 0;
      border-radius: 4px;
      background: #00FF88;
      color: #111;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    #toggle.on { background: #FF4444; color: #fff; }
    #toggle:disabled { opacity: .5; cursor: default; }
    #gesture {
      margin: 0;
      font-size: 12px;
      font-weight: bold;
      color: #00FF88;
      min-height: 15px;
      text-align: center;
    }
    #error { margin: 0; font-size: 10px; color: #FF6666; text-align: center; }
    #diag {
      margin: 0;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 9px;
      color: #7a7a7a;
      text-align: center;
      user-select: all;
    }
    .legend {
      font-size: 9px;
      color: #666;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px 6px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h3>✋ Gesture Controller</h3>
  <button id="toggle" disabled>...</button>
  <p id="gesture"></p>
  <p id="diag"></p>
  <p id="error"></p>
  <!-- Filled in from the GESTURES table in gestures.js. -->
  <div class="legend"></div>
  <script src="gestures.js"></script>
  <script src="popup.js"></script>
</body>
</html>
